name: Flutter Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Apply Case Lab visual theme
        run: python3 tool/apply_case_lab_theme.py vendor/CS2-Simulator
      - name: Check Flutter SDK
        working-directory: vendor/CS2-Simulator
        run: flutter --version
      - name: Get dependencies
        working-directory: vendor/CS2-Simulator
        run: flutter pub get
      - name: Remove orphaned generated assets
        working-directory: vendor/CS2-Simulator
        run: dart run tool/prune_generated_assets.dart
      - name: Optimize game image assets
        run: python tool/optimize_assets.py vendor/CS2-Simulator/assets
      - name: Analyze
        working-directory: vendor/CS2-Simulator
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: vendor/CS2-Simulator
        run: flutter test
      - name: Build release APK
        working-directory: vendor/CS2-Simulator
        run: flutter build apk --release
      - name: Prepare release assets
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        run: |
          mkdir -p dist
          cp vendor/CS2-Simulator/build/app/outputs/flutter-apk/app-release.apk dist/Case-Lab-CS2-Simulator.apk
          sha256sum dist/Case-Lab-CS2-Simulator.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: case-lab-cs2-simulator-apk
          path: |
            vendor/CS2-Simulator/build/app/outputs/flutter-apk/app-release.apk
            dist/Case-Lab-CS2-Simulator.apk
            dist/SHA256SUMS.txt
      - name: Publish GitHub prerelease
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.15.0-caselab.${{ github.run_number }}
          name: Case Lab CS2 Simulator v0.15.0 (build ${{ github.run_number }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/Case-Lab-CS2-Simulator.apk
            dist/SHA256SUMS.txt
